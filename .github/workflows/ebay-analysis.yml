name: eBay Sold Analysis

# 手動実行 + 毎週月曜9時（日本時間）に自動実行
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        default: 'discover'
        type: choice
        options:
          - discover
          - custom
      keywords:
        description: 'カスタムキーワード（カンマ区切り、modeがcustomの場合のみ）'
        required: false
        default: ''
      pages:
        description: 'ページ数（1ページ=約60件、APIの消費に注意）'
        required: false
        default: '1'
  schedule:
    # 毎週月曜 0:00 UTC = 日本時間 月曜 9:00
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Run analysis
        working-directory: sourcing-tool
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          if [ "${{ inputs.mode }}" = "custom" ] && [ -n "${{ inputs.keywords }}" ]; then
            python ebay_sold_analyzer.py \
              --keywords "${{ inputs.keywords }}" \
              --pages ${{ inputs.pages || '1' }} \
              --output "data/custom_${TIMESTAMP}.csv"
          else
            python ebay_sold_analyzer.py \
              --discover \
              --pages ${{ inputs.pages || '1' }} \
              --output "data/discovery_${TIMESTAMP}.csv"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ebay-analysis-results
          path: sourcing-tool/data/
          retention-days: 90

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sourcing-tool/data/
          git diff --staged --quiet || git commit -m "Auto: eBay analysis results $(date +%Y-%m-%d)"
          git push
